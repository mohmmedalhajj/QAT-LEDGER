name: qat_ledger
description: "ميزان القات (QAT LEDGER) — نظام محاسبي وإداري متكامل لوكالات ومكاتب القات بدون إنترنت"
publish_to: "none"
version: 2.1.0+201

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  archive: ^3.6.1
  crypto: ^3.0.6
  cryptography: ^2.7.0
  excel: ^4.0.6
  file_picker: ^10.3.10
  image: ^4.3.0
  image_picker: ^1.1.2
  intl: any
  package_info_plus: ^8.1.1
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.11.1
  printing: ^5.13.4
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.2
  shared_preferences: ^2.3.3
  sqflite: ^2.4.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_logo.png
    - assets/images/store_icon_1024.png
    - assets/fonts/OFL.txt
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
