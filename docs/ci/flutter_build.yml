name: Flutter Analyze, Test & Release APK Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev zip

      - name: Show toolchain information
        run: |
          flutter --version
          dart --version
          java -version
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "NO_KVM_DEVICE"
          fi

      - name: Fetch Flutter packages
        run: flutter pub get

      - name: Run Flutter analyzer
        run: |
          set -o pipefail
          mkdir -p ci-dist
          set +e
          flutter analyze 2>&1 | tee ci-dist/flutter_analyze.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            python3 - <<'PY' || true
          import re
          with open('ci-dist/flutter_analyze.log', encoding='utf-8', errors='replace') as fh:
              for line in fh:
                  m = re.match(r'^\s*(error|warning|info)\s+(?:•|-)\s+(.+?)\s+(?:•|-)\s+([^:\s]+):(\d+):(\d+)\s+(?:•|-)\s+(\S+)\s*$', line.strip())
                  if m:
                      sev, msg, fpath, ln, col, code = m.groups()
                      level = 'error' if sev == 'error' else 'warning'
                      print(f'::{level} file={fpath},line={ln},col={col}::{sev} [{code}] {msg}')
          PY
            exit "$RC"
          fi

      - name: Run Flutter tests
        run: |
          set -o pipefail
          mkdir -p ci-dist
          set +e
          flutter test -r expanded 2>&1 | tee ci-dist/flutter_test.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            python3 - <<'PY' || true
          lines = open('ci-dist/flutter_test.log', encoding='utf-8', errors='replace').read().splitlines()
          fail_chunks = []
          for idx, ln in enumerate(lines):
              if '[E]' in ln or 'EXCEPTION CAUGHT BY' in ln or 'Some tests failed.' in ln:
                  start = max(0, idx - 1)
                  end = min(len(lines), idx + 14)
                  fail_chunks.append(' | '.join(x.strip() for x in lines[start:end] if x.strip()))
          if not fail_chunks:
              fail_chunks = [' | '.join(x.strip() for x in lines[-35:] if x.strip())]
          for msg in fail_chunks[:12]:
              print(f'::error title=flutter_test::{msg[:900]}')
          PY
            exit "$RC"
          fi

      - name: Ensure Android Gradle wrapper exists
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.aistudio.tofanqat /tmp/flutter_gradle_scaffold
            cp /tmp/flutter_gradle_scaffold/android/gradlew android/gradlew
            cp /tmp/flutter_gradle_scaffold/android/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/flutter_gradle_scaffold/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      - name: Configure release signing key (fallback to Debug signing if missing)
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          rm -f android/key.properties android/app/release.jks

          if [ -n "$KEYSTORE_B64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then
            if echo "$KEYSTORE_B64" | base64 --decode > android/app/release.jks 2>/dev/null && \
               test -s android/app/release.jks && \
               keytool -list \
                 -keystore android/app/release.jks \
                 -storepass "$KEYSTORE_PASSWORD" \
                 -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              printf "storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
                "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
                > android/key.properties
              echo "signed_by=release_keystore" >> "$GITHUB_OUTPUT"
              echo "Original release signing key configured and checked."
            else
              rm -f android/key.properties android/app/release.jks
              echo "signed_by=debug_fallback" >> "$GITHUB_OUTPUT"
              echo "::warning::Release signing secrets could not be decoded/verified; falling back to Debug signing automatically."
            fi
          else
            echo "signed_by=debug_fallback" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are missing; falling back to Debug signing automatically."
          fi

      - name: Provision paired Ed25519 licensing keypair
        id: ed25519
        env:
          QAT_DEV_ED25519_SEED_B64: ${{ secrets.QAT_DEV_ED25519_SEED_B64 }}
          QAT_LICENSE_PUBLIC_KEYS: ${{ secrets.QAT_LICENSE_PUBLIC_KEYS }}
          SEED_TMP_PATH: ${{ runner.temp }}/dev_bootstrap_seed.b64
        run: |
          set -euo pipefail
          rm -f android/app/src/developer/assets/dev_bootstrap_seed.b64 "$SEED_TMP_PATH"

          eval "$(python3 - <<'PY'
          import base64, hashlib, os, re, shlex, subprocess

          raw_seed = os.environ.get('QAT_DEV_ED25519_SEED_B64', '').strip()
          if raw_seed:
              clean = re.sub(r'\s+', '', raw_seed)
              if re.fullmatch(r'[0-9a-fA-F]{64}', clean):
                  seed32 = bytes.fromhex(clean)
              else:
                  norm = clean.replace('-', '+').replace('_', '/')
                  norm += '=' * ((4 - len(norm) % 4) % 4)
                  seed32 = base64.b64decode(norm)
              if len(seed32) != 32:
                  raise SystemExit(f'QAT_DEV_ED25519_SEED_B64 must decode to 32 bytes, got {len(seed32)}')
              source_label = 'secret'
          else:
              pkcs8 = subprocess.check_output(['openssl', 'genpkey', '-algorithm', 'ed25519', '-outform', 'DER'])
              assert len(pkcs8) == 48 and pkcs8[:16] == bytes.fromhex('302e020100300506032b657004220420')
              seed32 = pkcs8[16:]
              source_label = 'ephemeral_paired'

          seed_b64 = base64.b64encode(seed32).decode('ascii')
          pkcs8 = bytes.fromhex('302e020100300506032b657004220420') + seed32
          spki = subprocess.check_output(['openssl', 'pkey', '-inform', 'DER', '-pubout', '-outform', 'DER'], input=pkcs8)
          assert len(spki) == 44 and spki[:12] == bytes.fromhex('302a300506032b6570032100')
          raw_pub = spki[12:]
          kotlin_kid = 'QLK-' + hashlib.sha256(raw_pub).hexdigest()[:8].upper()
          raw_b64url = base64.urlsafe_b64encode(raw_pub).decode('ascii').rstrip('=')
          paired_entry = f'{kotlin_kid}:{raw_b64url}'

          extra_raw = os.environ.get('QAT_LICENSE_PUBLIC_KEYS', '').strip()
          entries = [paired_entry]
          seen = {paired_entry}
          if extra_raw:
              for part in re.split(r'[,;\n]+', extra_raw):
                  tok = part.strip()
                  if tok and tok not in seen:
                      seen.add(tok)
                      entries.append(tok)

          merged_keys = ','.join(entries)
          with open(os.environ['SEED_TMP_PATH'], 'w', encoding='ascii') as fh:
              fh.write(seed_b64)
          os.chmod(os.environ['SEED_TMP_PATH'], 0o600)

          print(f'SEED_B64={shlex.quote(seed_b64)}')
          print(f'MERGED_KEYS={shlex.quote(merged_keys)}')
          print(f'KOTLIN_KID={shlex.quote(kotlin_kid)}')
          print(f'SOURCE_LABEL={shlex.quote(source_label)}')
          PY
          )"

          echo "::add-mask::${SEED_B64}"
          echo "RESOLVED_QAT_LICENSE_PUBLIC_KEYS=${MERGED_KEYS}" >> "$GITHUB_ENV"
          echo "public_key_id=${KOTLIN_KID}" >> "$GITHUB_OUTPUT"
          echo "seed_source=${SOURCE_LABEL}" >> "$GITHUB_OUTPUT"
          echo "Paired Ed25519 licensing keypair provisioned (${SOURCE_LABEL}, KeyID=${KOTLIN_KID})."

      - name: Build Customer Release APK
        env:
          QAT_LICENSE_PUBLIC_KEYS: ${{ env.RESOLVED_QAT_LICENSE_PUBLIC_KEYS }}
        run: |
          rm -f android/app/src/developer/assets/dev_bootstrap_seed.b64
          flutter build apk --release --flavor customer \
            -t lib/main_customer.dart \
            --dart-define=APP_EDITION=customer \
            --dart-define=QAT_LICENSE_PUBLIC_KEYS="${QAT_LICENSE_PUBLIC_KEYS}"

      - name: Build Developer Release APK
        env:
          QAT_LICENSE_PUBLIC_KEYS: ${{ env.RESOLVED_QAT_LICENSE_PUBLIC_KEYS }}
          SEED_TMP_PATH: ${{ runner.temp }}/dev_bootstrap_seed.b64
        run: |
          mkdir -p android/app/src/developer/assets
          cp "$SEED_TMP_PATH" android/app/src/developer/assets/dev_bootstrap_seed.b64
          flutter build apk --release --flavor developer \
            -t lib/main_developer.dart \
            --dart-define=APP_EDITION=developer \
            --dart-define=QAT_LICENSE_PUBLIC_KEYS="${QAT_LICENSE_PUBLIC_KEYS}"

      - name: Cleanup temporary developer bootstrap seed
        if: always()
        env:
          SEED_TMP_PATH: ${{ runner.temp }}/dev_bootstrap_seed.b64
        run: |
          rm -f android/app/src/developer/assets/dev_bootstrap_seed.b64 "$SEED_TMP_PATH"

      - name: Verify APKs and prepare release files
        run: |
          set -euo pipefail

          mkdir -p ci-dist

          cp build/app/outputs/flutter-apk/app-customer-release.apk \
            ci-dist/QAT_LEDGER_CUSTOMER_RELEASE.apk

          cp build/app/outputs/flutter-apk/app-developer-release.apk \
            ci-dist/QAT_LEDGER_DEVELOPER_RELEASE.apk

          git archive --format=zip \
            --output=ci-dist/QAT_LEDGER_FLUTTER_SOURCE.zip \
            HEAD -- . ':!backup'

          # Verify customer/developer isolation & paired bootstrap seed presence
          python3 - <<'PY'
          import zipfile

          with zipfile.ZipFile('ci-dist/QAT_LEDGER_CUSTOMER_RELEASE.apk') as zf:
              names = zf.namelist()
              if any('dev_bootstrap_seed.b64' in n for n in names):
                  raise SystemExit('ERROR: Customer APK must never contain dev_bootstrap_seed.b64')

          with zipfile.ZipFile('ci-dist/QAT_LEDGER_DEVELOPER_RELEASE.apk') as zf:
              names = zf.namelist()
              if 'assets/dev_bootstrap_seed.b64' not in names:
                  raise SystemExit('ERROR: Developer APK is missing paired assets/dev_bootstrap_seed.b64')

          with zipfile.ZipFile('ci-dist/QAT_LEDGER_FLUTTER_SOURCE.zip') as zf:
              names = zf.namelist()
              if any('dev_bootstrap_seed.b64' in n for n in names):
                  raise SystemExit('ERROR: Source archive must never contain dev_bootstrap_seed.b64')

          print('Verified APK flavor asset isolation and paired bootstrap seed.')
          PY

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK path was not found."
            exit 1
          fi

          BUILD_TOOLS_DIR=$(find "$SDK_ROOT/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          AAPT2="$BUILD_TOOLS_DIR/aapt2"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          test -x "$AAPT2"
          test -x "$APKSIGNER"

          "$AAPT2" dump badging ci-dist/QAT_LEDGER_CUSTOMER_RELEASE.apk \
            | tee ci-dist/customer-badging.txt

          "$AAPT2" dump badging ci-dist/QAT_LEDGER_DEVELOPER_RELEASE.apk \
            | tee ci-dist/developer-badging.txt

          grep -q "package: name='com.aistudio.tofanqat.nxzwmb'" \
            ci-dist/customer-badging.txt

          grep -q "package: name='com.aistudio.tofanqat.nxzwmb.dev'" \
            ci-dist/developer-badging.txt

          "$APKSIGNER" verify --print-certs --verbose \
            ci-dist/QAT_LEDGER_CUSTOMER_RELEASE.apk \
            | tee ci-dist/customer-signature.txt

          "$APKSIGNER" verify --print-certs --verbose \
            ci-dist/QAT_LEDGER_DEVELOPER_RELEASE.apk \
            | tee ci-dist/developer-signature.txt

          (
            cd ci-dist
            sha256sum \
              QAT_LEDGER_CUSTOMER_RELEASE.apk \
              QAT_LEDGER_DEVELOPER_RELEASE.apk \
              QAT_LEDGER_FLUTTER_SOURCE.zip \
              | tee SHA256SUMS.txt
          )

          ls -lh ci-dist/

      - name: Upload release APKs and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qat-ledger-release-apks
          path: ci-dist/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release APKs
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_id }}-${{ github.run_attempt }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "QAT-LEDGER Flutter Build ($SHORT_SHA)" \
            --notes "Automated verified release APKs for commit $SHORT_SHA (signing: ${{ steps.keystore.outputs.signed_by }})." \
            --prerelease \
            ci-dist/QAT_LEDGER_CUSTOMER_RELEASE.apk \
            ci-dist/QAT_LEDGER_DEVELOPER_RELEASE.apk \
            ci-dist/QAT_LEDGER_FLUTTER_SOURCE.zip \
            ci-dist/SHA256SUMS.txt

      - name: Smoke-test APKs on Android Emulator
        if: always()
        timeout-minutes: 15
        run: |
          set -euo pipefail

          mkdir -p ci-dist
          LOG="ci-dist/emulator_smoke.log"
          BOOT_LOG="ci-dist/emulator_boot.log"
          LOGCAT_LOG="ci-dist/adb_logcat.txt"
          : > "$LOG"
          : > "$BOOT_LOG"
          : > "$LOGCAT_LOG"

          if [ ! -s ci-dist/QAT_LEDGER_CUSTOMER_RELEASE.apk ] || \
             [ ! -s ci-dist/QAT_LEDGER_DEVELOPER_RELEASE.apk ]; then
            echo "NOT_EXECUTED: Required APK files are missing." | tee -a "$LOG"
            exit 0
          fi

          if [ ! -e /dev/kvm ]; then
            echo "NOT_EXECUTED: /dev/kvm device is not present on this runner." | tee -a "$LOG"
            exit 0
          fi

          sudo chmod a+rw /dev/kvm 2>/dev/null || true

          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "NOT_EXECUTED: KVM is not readable/writable by runner user." | tee -a "$LOG"
            exit 0
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "FAIL: Android SDK path was not found (ANDROID_HOME=${ANDROID_HOME:-}, ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-})." | tee -a "$LOG"
            exit 1
          fi

          export HOME="${HOME:-/home/runner}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          unset ANDROID_SDK_HOME || true
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"

          {
            echo "HOME=$HOME"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            echo "ANDROID_USER_HOME=$ANDROID_USER_HOME"
            echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          } | tee -a "$LOG"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          ADB="$SDK_ROOT/platform-tools/adb"

          if [ ! -x "$SDKMANAGER" ] || [ ! -x "$AVDMANAGER" ]; then
            echo "FAIL: Android SDK command-line tools are missing under $SDK_ROOT/cmdline-tools/latest/bin." | tee -a "$LOG"
            exit 1
          fi

          sudo apt-get update && sudo apt-get install -y libpulse0 libgl1 libnss3 libxkbcommon0 || true
          set +o pipefail
          yes | timeout 60 "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true

          SYS_IMAGE_PKG="system-images;android-34;google_apis;x86_64"
          SYS_IMAGE_TAG="google_apis"
          if ! yes | timeout 300 "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "emulator" \
            "$SYS_IMAGE_PKG"; then
            SYS_IMAGE_PKG="system-images;android-34;default;x86_64"
            SYS_IMAGE_TAG="default"
            yes | timeout 300 "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
              "platform-tools" \
              "emulator" \
              "$SYS_IMAGE_PKG"
          fi
          set -o pipefail

          if [ ! -x "$EMULATOR" ] || [ ! -x "$ADB" ]; then
            echo "FAIL: Emulator or ADB installation failed under $SDK_ROOT." | tee -a "$LOG"
            exit 1
          fi

          SYS_IMAGE_DIR="$SDK_ROOT/system-images/android-34/$SYS_IMAGE_TAG/x86_64"
          if [ ! -d "$SYS_IMAGE_DIR" ] || [ ! -f "$SYS_IMAGE_DIR/source.properties" ]; then
            echo "FAIL: Required Android SDK system image ($SYS_IMAGE_PKG) is not present at $SYS_IMAGE_DIR." | tee -a "$LOG"
            exit 1
          fi

          if ! "$EMULATOR" -accel-check >> "$LOG" 2>&1; then
            cat "$LOG"
            echo "NOT_EXECUTED: Emulator hardware acceleration is unavailable." | tee -a "$LOG"
            exit 0
          fi
          cat "$LOG"

          AVD_NAME="qat_smoke"
          AVD_DIR="$ANDROID_AVD_HOME/${AVD_NAME}.avd"
          AVD_INI="$ANDROID_AVD_HOME/${AVD_NAME}.ini"

          rm -rf "$AVD_DIR" "$AVD_INI"

          if ! "$AVDMANAGER" create avd \
            --force \
            --name "$AVD_NAME" \
            --package "$SYS_IMAGE_PKG" \
            --tag "$SYS_IMAGE_TAG" \
            --abi x86_64 \
            --path "$AVD_DIR" \
            --device "pixel_6" <<< "no" >> "$LOG" 2>&1; then
            echo "Retrying avdmanager create avd without explicit --device profile..." | tee -a "$LOG"
            "$AVDMANAGER" create avd \
              --force \
              --name "$AVD_NAME" \
              --package "$SYS_IMAGE_PKG" \
              --tag "$SYS_IMAGE_TAG" \
              --abi x86_64 \
              --path "$AVD_DIR" <<< "no" >> "$LOG" 2>&1
          fi

          if [ ! -s "$AVD_INI" ] || [ ! -d "$AVD_DIR" ] || [ ! -s "$AVD_DIR/config.ini" ]; then
            echo "FAIL: AVD creation did not produce $AVD_INI, $AVD_DIR, or config.ini." | tee -a "$LOG"
            ls -la "$ANDROID_AVD_HOME" | tee -a "$LOG" || true
            exit 1
          fi

          echo "=== Created AVD files ===" | tee -a "$LOG"
          ls -la "$ANDROID_AVD_HOME" | tee -a "$LOG"
          cat "$AVD_INI" | tee -a "$LOG"

          echo "=== emulator -list-avds ===" | tee -a "$LOG"
          AVD_LIST=$("$EMULATOR" -list-avds 2>&1 | tr -d '\r' || true)
          printf '%s\n' "$AVD_LIST" | tee -a "$LOG"

          if ! printf '%s\n' "$AVD_LIST" | grep -Fxq "$AVD_NAME"; then
            echo "FAIL: AVD '$AVD_NAME' was not reported by 'emulator -list-avds' under ANDROID_AVD_HOME=$ANDROID_AVD_HOME." | tee -a "$LOG"
            exit 1
          fi

          timeout 15 "$ADB" start-server || true

          EMU_PID=""
          cleanup() {
            set +e
            if [ -x "$ADB" ]; then
              timeout 15 "$ADB" logcat -d > "$LOGCAT_LOG" 2>&1 || true
              timeout 10 "$ADB" emu kill >/dev/null 2>&1 || true
            fi
            if [ -n "$EMU_PID" ] && kill -0 "$EMU_PID" 2>/dev/null; then
              kill "$EMU_PID" >/dev/null 2>&1 || true
              sleep 2
              kill -9 "$EMU_PID" >/dev/null 2>&1 || true
            fi
            if [ -x "$ADB" ]; then
              timeout 10 "$ADB" kill-server >/dev/null 2>&1 || true
            fi
            if [ -f "$BOOT_LOG" ]; then
              echo "=== emulator_boot.log (tail) ==="
              tail -n 80 "$BOOT_LOG" || true
            fi
            if [ -s "$LOGCAT_LOG" ]; then
              echo "=== adb_logcat.txt (tail) ==="
              tail -n 60 "$LOGCAT_LOG" || true
            fi
            if [ -s "$LOG" ]; then
              SUMMARY=$(tr '\n' '|' < "$LOG" | sed 's/|/ | /g')
              if grep -q "^FAIL:" "$LOG"; then
                BOOT_TAIL=$(tail -n 20 "$BOOT_LOG" 2>/dev/null | tr '\n' ' ' || true)
                echo "::error title=emulator_smoke::${SUMMARY:0:700} BOOT_TAIL: ${BOOT_TAIL:0:400}"
              else
                echo "::notice title=emulator_smoke::${SUMMARY:0:900}"
              fi
            fi
          }
          trap cleanup EXIT

          timeout 660 "$EMULATOR" \
            -avd "$AVD_NAME" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -wipe-data \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            </dev/null > "$BOOT_LOG" 2>&1 &

          EMU_PID=$!

          DEVICE_READY=false
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "FAIL: Emulator process stopped unexpectedly before ADB came online." | tee -a "$LOG"
              exit 1
            fi

            if timeout 5 "$ADB" devices 2>/dev/null | grep -qE "^emulator-[0-9]+[[:space:]]+device"; then
              DEVICE_READY=true
              break
            fi

            sleep 2
          done

          if [ "$DEVICE_READY" != "true" ]; then
            echo "FAIL: Emulator did not connect to ADB within 180s timeout." | tee -a "$LOG"
            exit 1
          fi

          BOOTED=false
          for i in $(seq 1 90); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "FAIL: Emulator process stopped unexpectedly during Android boot." | tee -a "$LOG"
              exit 1
            fi

            BOOT=$(timeout 5 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$BOOT" = "1" ]; then
              BOOTED=true
              break
            fi

            sleep 2
          done

          if [ "$BOOTED" != "true" ]; then
            echo "FAIL: Android did not reach sys.boot_completed=1 within 180s timeout." | tee -a "$LOG"
            exit 1
          fi

          timeout 15 "$ADB" logcat -c || true

          test -s ci-dist/customer-badging.txt
          test -s ci-dist/developer-badging.txt

          CUSTOMER_ACTIVITY=$(awk -F"'" '/^launchable-activity:/{print $2; exit}' ci-dist/customer-badging.txt)
          DEVELOPER_ACTIVITY=$(awk -F"'" '/^launchable-activity:/{print $2; exit}' ci-dist/developer-badging.txt)

          if [ -z "$CUSTOMER_ACTIVITY" ] || [ -z "$DEVELOPER_ACTIVITY" ]; then
            echo "FAIL: Could not find launchable activity in APK manifests." | tee -a "$LOG"
            exit 1
          fi

          if [[ "$CUSTOMER_ACTIVITY" == .* ]]; then
            CUSTOMER_ACTIVITY="com.aistudio.tofanqat.nxzwmb${CUSTOMER_ACTIVITY}"
          fi

          if [[ "$DEVELOPER_ACTIVITY" == .* ]]; then
            DEVELOPER_ACTIVITY="com.aistudio.tofanqat.nxzwmb.dev${DEVELOPER_ACTIVITY}"
          fi

          echo "=== Installing and launching Customer APK ===" | tee -a "$LOG"
          timeout 60 "$ADB" install -r ci-dist/QAT_LEDGER_CUSTOMER_RELEASE.apk \
            | tee -a "$LOG"

          timeout 30 "$ADB" shell am start -W \
            -n "com.aistudio.tofanqat.nxzwmb/$CUSTOMER_ACTIVITY" \
            | tee -a "$LOG"

          sleep 6

          CUST_PID=$(timeout 10 "$ADB" shell pidof com.aistudio.tofanqat.nxzwmb || true)
          echo "CUSTOMER_PID=$CUST_PID" | tee -a "$LOG"

          timeout 20 "$ADB" exec-out screencap -p > ci-dist/customer_launch.png || true

          echo "=== Installing and launching Developer APK ===" | tee -a "$LOG"
          timeout 60 "$ADB" install -r ci-dist/QAT_LEDGER_DEVELOPER_RELEASE.apk \
            | tee -a "$LOG"

          timeout 30 "$ADB" shell am start -W \
            -n "com.aistudio.tofanqat.nxzwmb.dev/$DEVELOPER_ACTIVITY" \
            | tee -a "$LOG"

          sleep 6

          DEV_PID=$(timeout 10 "$ADB" shell pidof com.aistudio.tofanqat.nxzwmb.dev || true)
          echo "DEVELOPER_PID=$DEV_PID" | tee -a "$LOG"

          timeout 20 "$ADB" exec-out screencap -p > ci-dist/developer_launch.png || true

          timeout 20 "$ADB" logcat -d > "$LOGCAT_LOG" 2>&1 || true
          timeout 20 "$ADB" logcat -d -s AndroidRuntime:E flutter:E \
            >> "$LOG" 2>&1 || true

          if [ -z "$CUST_PID" ] || [ -z "$DEV_PID" ]; then
            echo "FAIL: One or both apps did not remain running (CUSTOMER_PID='$CUST_PID', DEVELOPER_PID='$DEV_PID')." | tee -a "$LOG"
            exit 1
          fi

          echo "PASS: Customer and Developer apps installed, launched, and remained running on the emulator." \
            | tee -a "$LOG"

      - name: Upload emulator smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qat-ledger-emulator-smoke
          path: |
            ci-dist/emulator_smoke.log
            ci-dist/emulator_boot.log
            ci-dist/adb_logcat.txt
            ci-dist/customer_launch.png
            ci-dist/developer_launch.png
          if-no-files-found: warn
          retention-days: 14
